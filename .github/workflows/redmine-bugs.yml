name: Redmine Bug Check (hourly)

on:
  # Lịch chạy do scheduled task của Claude gọi (GitHub schedule không ổn định).
  # Claude gọi với manual=false: chỉ gửi tin khi có bug.
  workflow_dispatch:
    inputs:
      manual:
        description: "Chạy tay (luôn gửi tin kể cả khi không có bug)"
        type: boolean
        default: true

jobs:
  bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bug check
        env:
          TZ: Asia/Ho_Chi_Minh
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redmine_check.py --mode bugs ${{ inputs.manual && '--always' || '' }}
