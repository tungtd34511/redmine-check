name: Redmine Bug Check (hourly)

on:
  # Lịch chạy do cron-job.org gọi qua API (lịch của GitHub không ổn định).
  # cron-job.org gửi inputs.manual = "false"; bấm tay trên GitHub thì manual = "true".
  workflow_dispatch:
    inputs:
      manual:
        description: "Chạy tay (luôn gửi tin)"
        default: "true"

jobs:
  bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bug check
        id: check
        timeout-minutes: 8
        env:
          TZ: Asia/Ho_Chi_Minh
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redmine_check.py --mode bugs ${{ inputs.manual != 'false' && '--always' || '' }}
      - name: Notify failure
        if: (failure() || cancelled()) && steps.check.outputs.notified != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ${WORKFLOW_NAME} lỗi, xem log: ${RUN_URL}" > /dev/null
