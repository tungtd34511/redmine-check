name: Redmine Daily Check

on:
  # Lịch chạy do cron-job.org gọi qua API (lịch của GitHub không ổn định).
  # cron-job.org gửi inputs.manual = "false"; bấm tay trên GitHub thì manual = "true".
  workflow_dispatch:
    inputs:
      manual:
        description: "Chạy tay (luôn gửi tin)"
        default: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Redmine check
        env:
          TZ: Asia/Ho_Chi_Minh
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redmine_check.py --mode daily ${{ inputs.manual != 'false' && '--force' || '' }}
