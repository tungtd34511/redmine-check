name: Redmine Daily Check

on:
  schedule:
    # 01:50 UTC = 08:50 giờ Việt Nam, thứ 2 - thứ 6
    # (GitHub thường trễ 5-15 phút, nên đặt sớm để tin nhắn tới khoảng 9h)
    - cron: "50 1 * * 1-5"
  workflow_dispatch:        # nút "Run workflow" để chạy thử bằng tay

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Redmine check
        env:
          TZ: Asia/Ho_Chi_Minh
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redmine_check.py --mode daily
